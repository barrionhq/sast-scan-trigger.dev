# nginx.conf (relevant bits)
events {}

http {
  # This now governs idle close for HTTP/2, since http2_idle_timeout is obsolete.
  keepalive_timeout 75s;   # ← set to 60–80s to reproduce your prod-ish drop

  # Good defaults for streaming
  sendfile off;            # avoid sendfile delays for tiny frames
  tcp_nodelay on;

  upstream app_upstream {
    server host.docker.internal:3030;
    keepalive 16;
  }

  server {
    listen 8443 ssl;       # ← no ‘http2’ here…
    http2 on;              # ← …use the standalone directive instead
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    location / {
      # Make SSE actually stream through NGINX:
      proxy_buffering off;                    # don’t buffer
      gzip off;                               # don’t compress
      add_header X-Accel-Buffering no;        # belt & suspenders for NGINX buffering
      proxy_set_header Accept-Encoding "";    # stop upstream gzip (SSE + gzip = sad)

      # Plain h1 to upstream is fine for SSE
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      proxy_read_timeout 30s;
      proxy_send_timeout 30s;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com https://*.stripe.com https://*.googletagmanager.com https://*.analytics.google.com https://static.cloudflareinsights.com https://*.doubleclick.net https://www.youtube.com https://player.vimeo.com https://cdn-cookieyes.com; worker-src 'self' blob:; connect-src 'self' https://*.barrion.io https://*.googletagmanager.com https://analytics.google.com https://*.analytics.google.com https://*.google-analytics.com https://*.googleapis.com https://*.doubleclick.net https://log.cookieyes.com https://cdn-cookieyes.com https://*.vimeo.com https://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; style-src 'self'; img-src 'self' data: https://*.googletagmanager.com https://cdn-cookieyes.com https://*.google.com https://*.google.co.in https://*.google.co.jp https://*.google.co.kr https://*.google.com.br https://*.google.fr https://*.google.de https://*.google.it https://*.google.es https://*.google.nl https://*.google.se https://*.google.no https://*.google.dk https://*.google.fi https://*.google.ru https://*.google.com.au https://*.google.co.uk https://*.google.com.mx https://*.google.com.sg https://*.google.com.hk https://*.google.co.id https://*.google.com.ph https://*.google.com.my https://*.google.co.th https://*.google.com.vn https://*.google.co.za https://*.google.com.ng https://*.google.com.pk https://*.google.com.ar https://*.google.cl https://*.google.com.pe https://*.google.ae https://*.google.sa https://*.google.eg https://*.google.co.il https://*.google.lk https://*.google.com.bd https://*.google.pl https://*.google.gr https://*.google.pt https://*.google.ch https://*.google.at https://*.google.ke https://*.google.ma https://*.google.uy https://*.google.bo https://*.google.ec https://*.google.py https://*.barrion.io blob: https://barrion.io; font-src 'self'; object-src 'none'; frame-ancestors 'none'; frame-src https://auth.barrion.io https://*.firebaseapp.com https://*.doubleclick.net https://*.stripe.com https://www.youtube.com https://player.vimeo.com;";

      proxy_pass http://app_upstream;
    }
  }
}
